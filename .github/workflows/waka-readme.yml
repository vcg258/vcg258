name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TIMEZONE: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          SHOW_PROJECTS: "False"          # 프로젝트별 시간 목록 숨김
          SHOW_LANGUAGE_PER_REPO: "False" # 언어별 저장소 개수 숨김
          SHOW_SHORT_INFO: "False"        # 비공개 저장소 개수 등 GitHub 요약 정보 숨김
          SHOW_COMMIT: "False"            # 커밋 시간대 통계 숨김
          SHOW_DAYS_OF_WEEK: "False"      # 요일별 커밋 통계 숨김
          SHOW_LOC_CHART: "False"
          SHOW_PROFILE_VIEWS: "False"
